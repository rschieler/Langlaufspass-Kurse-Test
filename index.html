<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#011627">
<title>Langlaufspass Kurse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday work tool for a ski instructor: calm, quick, big touch targets
   IDEA the Langlaufspass.ch brand: navy night band with the Churfirsten logo, cyan loipe accent
   PICTURE the white Churfirsten logo with cyan and pink skaters in the header band
   COLOUR white ground, navy ink #011627, brand cyan #26cfc8, pink #db1168 for money and actions, Esther-purple #a656ce for group courses
   TYPE Anton wordmark, Roboto Condensed for titles, times and figures, Montserrat for text (as on langlaufspass.ch)
   LAYOUT phone: band with title left and logo right, list, fixed tabs and pink button; wider: same column, max 760px centred */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#07121c);--ink:light-dark(#011627,#e9f3f6);--mut:light-dark(#566673,#9aadb8);--line:light-dark(#e2e8ec,#1c2e3b);--surf:light-dark(#f3f7f8,#0f1f2b);--sky:#011627;--brand:#26cfc8;--cy:light-dark(#0b8a85,#4fe3dc);--cybg:light-dark(#dcf6f4,#0d3433);--pk:light-dark(#db1168,#ff4f97);--pkbg:light-dark(#fde5ef,#3a1226);--pu:light-dark(#9447c2,#c89be6);--pubg:light-dark(#f2e8f9,#2c1a3a)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Montserrat,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.cond{font-family:"Roboto Condensed","Arial Narrow",sans-serif}
a{color:var(--cy)}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.band{background:var(--sky);color:#fff;position:relative;border-bottom:5px solid var(--brand)}
.band-in{max-width:760px;margin:0 auto;padding:8px 16px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:400 19px/1 Anton,Impact,"Arial Narrow",sans-serif;letter-spacing:.03em}
.gear{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center}
.gear svg{width:24px;height:24px}
h1{font:700 clamp(28px,8.4vw,44px)/1.02 "Roboto Condensed","Arial Narrow",sans-serif;text-transform:uppercase;margin:6px 0 2px;text-wrap:balance}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.logo{display:block;width:clamp(128px,34vw,230px);height:auto;margin:4px -6px -6px 0}
.sub{margin:2px 0 0;font-size:14px;color:#a7f3f0}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.figs b{display:block;font-size:34px;line-height:1;white-space:nowrap}
.figs span{font-size:13px;font-weight:500;color:#a7f3f0}
.figs .pk span{background:var(--pk);color:#fff;padding:1px 7px;border-radius:6px}
.ridge{display:block;width:100%;height:max(84px,11vw);margin-top:-6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 160px}
.day{font:600 14px/1.2 Montserrat,sans-serif;color:var(--mut);margin:22px 0 4px}
.empty{color:var(--mut);margin:8px 0 4px}
.ev,.li{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;color:var(--ink)}
.li{grid-template-columns:44px minmax(0,1fr) auto}
.tm{font-size:30px;font-weight:700;line-height:1;color:var(--cy);white-space:nowrap}
.ev.k .tm{color:var(--pu)}
.chip.grp{background:var(--pubg);color:var(--pu);border-color:transparent}
.ev.x b,.ev.x .tm{text-decoration:line-through;color:var(--mut)}
.ev b,.li b{display:block;font-weight:600;font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev small,.li small,.card small{display:block;color:var(--mut);font-size:14px;line-height:1.35}
.ev-r{display:grid;gap:5px;justify-items:end;text-align:right}
.amt{font-size:18px;font-weight:600;white-space:nowrap}
.pkt{color:var(--pk)}
.chip{font-size:13px;font-weight:600;line-height:1.5;padding:1px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--mut)}
.chip.paid{background:var(--cybg);color:var(--cy);border-color:transparent}
.chip.open{background:var(--pkbg);color:var(--pk);border-color:transparent}
.chip.off{text-decoration:line-through}
.av{width:44px;height:44px;border-radius:50%;background:var(--cybg);color:var(--cy);display:grid;place-items:center;font-size:18px;font-weight:700}
.due{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--pkbg);color:var(--ink);text-decoration:none;min-height:48px}
.due b{font-weight:600}
.due span{color:var(--pk);font-size:20px;font-weight:700;white-space:nowrap}
.note{background:var(--pkbg);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:15px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;line-height:1.2}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#011627}
.btn.pk{background:var(--pk);border-color:var(--pk);color:#fff}
.btn.ghost{background:none}
.btn.danger{background:none;color:var(--pk);border-color:transparent}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mt{margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.fm{display:grid;gap:14px}
.f{display:grid;gap:5px;font-size:14px;font-weight:600;color:var(--mut)}
.f input,.f select,.f textarea,.trow input,.trow select,.search input{font-size:16px;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;font-weight:400}
.f textarea{resize:vertical;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chips button{min-height:44px;min-width:52px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#011627}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;padding:4px 0 6px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surf);font-size:22px;line-height:1}
.step output{font:700 26px/1 "Roboto Condensed","Arial Narrow",sans-serif;min-width:2ch;text-align:center;color:var(--ink)}
.hint{color:var(--mut);font-size:14px;margin:6px 0 0}
.search{margin-top:16px}
.calnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.cal .wd{font-size:13px;color:var(--mut);text-align:center;font-weight:600}
.cal button{min-height:50px;border:0;border-radius:10px;background:var(--surf);color:var(--ink);display:grid;justify-items:center;align-content:center;gap:4px;font-weight:600;padding:4px 0}
.cal button.out{opacity:.35}
.cal button.td{box-shadow:inset 0 0 0 2px var(--cy)}
.cal button[aria-pressed=true]{background:var(--brand);color:#011627}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--cy)}
.dots i.k{background:var(--pu)}
.cal button[aria-pressed=true] .dots i{background:#011627}
.card{display:grid;gap:6px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:10px}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card-h b{font-size:19px;font-weight:600}
.fill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.fill .cond{font-size:18px;font-weight:600;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--surf);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--cy);border-radius:5px}
.months .bar{display:block}
.bar.thin{height:4px;margin-top:4px;box-shadow:none;background:none}
.bar.thin i{background:var(--mut)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:10px;margin-top:16px}
.big div{background:var(--surf);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mut);font-weight:500}
.big b{display:block;font:700 clamp(24px,7vw,32px)/1.1 "Roboto Condensed","Arial Narrow",sans-serif;color:var(--ink);white-space:nowrap}
.big .pk b{color:var(--pk)}
.big .main{background:var(--sky);color:#a7f3f0;grid-column:1/-1;box-shadow:inset 0 -4px 0 var(--brand)}
.big.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.big.three b{font-size:26px}
.big .main b{color:#fff}
.months{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:8px 12px;align-items:center;margin-top:8px}
.months span{font-size:15px}
.months .v{text-align:right;white-space:nowrap;font-size:17px;font-weight:600}
.months .v small{display:block;color:var(--mut);font-size:13px;font-weight:500}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t td{padding:7px 0;border-bottom:1px solid var(--line)}
.t td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t tr.sum td{font-weight:700;border-bottom:0}
section.s{margin-top:22px}
section.s h3{font:600 15px/1.2 Montserrat,sans-serif;color:var(--mut);margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin-top:12px;font-size:16px}
.kv span{color:var(--mut)}
.kv b{font-weight:600}
.kv b.cond{font-size:22px}
.trm{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trm .tm{font-size:26px}
.trm b{display:block;font-weight:600}
.trm small{display:block;color:var(--mut);font-size:14px}
.trm .row{grid-column:2}
.tn{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.tn b{font-weight:600}
.tn small{display:block;color:var(--mut);font-size:14px}
.trow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;margin-bottom:6px}
.trow input,.trow select{padding:8px}
.tprow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px;margin-bottom:14px;align-items:center}
.tpsub{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tprow .tpsub input[data-f=km]{width:5.2em;flex:none}.tpsub span{color:var(--mut);font-size:14px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:16px;cursor:pointer}.chk input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--cy)}
.tprow input:not([type=checkbox]){font-size:16px;min-height:46px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
details summary{cursor:pointer;color:var(--cy);font-weight:600;min-height:44px;display:flex;align-items:center}
.kv small.hint{display:inline;margin:0 0 0 6px}
.x{width:44px;height:44px;border:0;border-radius:12px;background:var(--surf);color:var(--ink);font-size:22px;line-height:1;flex:none}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-h h2{font:700 30px/1.05 "Roboto Condensed","Arial Narrow",sans-serif;margin:2px 0 4px;text-wrap:balance}
.sh-h p{margin:0;color:var(--mut)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(4,14,20,.5)}
.sh-box{position:relative;width:100%;max-width:760px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sh-box::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sh-box{animation:none}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{display:grid;justify-items:center;gap:1px;padding:8px 0 6px;min-height:58px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
nav.tabs a[aria-current=page]{color:var(--cy)}
nav.tabs svg{width:24px;height:24px}
.fab{text-transform:uppercase;letter-spacing:.02em;position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;height:56px;padding:0 22px;border:0;border-radius:28px;background:var(--pk);color:#fff;font-size:20px;font-weight:700;box-shadow:0 4px 10px -4px rgba(209,18,108,.7)}
.fab[hidden]{display:none}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:min(90vw,420px);font-weight:500;text-align:center}
.toast[hidden]{display:none}
.env-test{--sky:#7f1414}
.envtag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:6px;background:#fff;color:#7f1414;font:400 14px/1.3 Anton,Impact,sans-serif;letter-spacing:.06em;vertical-align:2px}
@media (max-width:380px){.tm{font-size:26px}.figs b{font-size:28px}}
</style>
</head>
<body>
<main id="main"></main>
<button id="fab" class="fab cond" data-act="fab" type="button">+ Lektion</button>
<nav class="tabs" aria-label="Bereiche">
<a href="#heute" data-v="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Heute</span></a>
<a href="#kalender" data-v="kalender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Kalender</span></a>
<a href="#kunden" data-v="kunden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Kunden</span></a>
<a href="#kurse" data-v="kurse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c.8-3.4 3-5 6-5s5.2 1.6 6 5M15.5 14.6c2.6.2 4.3 1.6 5 4.4"/></svg><span>Kurse</span></a>
<a href="#geld" data-v="geld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v.01M18 14.5v.01"/></svg><span>Geld</span></a>
</nav>
<div id="sheet" class="sheet" hidden><div class="sh-bg" data-act="close"></div><div class="sh-box" role="dialog" aria-modal="true" aria-label="Details"><div id="shIn"></div></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="jspdf.min.js"></script>
<script src="config.js"></script>
<script type="module" src="firebase.js"></script>
<script>
{
const DEF={stundentarif:60,zuschlag:0,treffpunkte:[{name:'Flumserberg Sennenstube',km:14.1,park:true},{name:'Flumserberg Prodalp',km:16.7,park:true},{name:'Einsiedeln Trachslau Loipe',km:67.6,park:false},{name:'Einsiedeln Schwedentritt Loipe',km:67.4,park:false}],heimadresse:'Pfrundwingertstrasse 5, 8893 Flums Hochwiese',kmAnsatz:0.75,park4:5,park10:8,parkWoche:40,absender:'Esther',firma:'Langlaufspass.ch',adresse:'',email:'info@langlaufspass.ch',
tplOk:'Hallo {vorname}, gerne bestätige ich deine Langlauflektion am {datum} von {zeit} bis {bis} Uhr. Treffpunkt: {treffpunkt}. Ich freue mich! {absender}, Langlaufspass.ch',
tplErin:'Hallo {vorname}, kurze Erinnerung an die Langlauflektion am {datum} um {zeit} Uhr. Treffpunkt: {treffpunkt}. Bis bald! {absender}',
tplAbs:'Hallo {vorname}, leider muss ich die Lektion am {datum} um {zeit} Uhr wegen der Verhältnisse absagen. Ich melde mich für einen neuen Termin. {absender}'};
const ZA=['Bar','TWINT','Überweisung','Gutschein'],NV='Nicht verrechnet',ZP=[...ZA,NV],ZS={'Überweisung':'Überw.','Nicht verrechnet':'Nicht verr.'};
const KAT=['Parkgebühren','Material & Wachs','Mietmaterial','Weiterbildung','Versicherung','Werbung & Website','Telefon','Diverses'];
const NIV=['Einsteiger','Fortgeschritten','Sportlich'];
const TECH=['Klassisch','Skating','Beides'];
const DAUER=[0.5,1,1.5,2,2.5,3],QDUR=[1,1.5,2];
const VIEWS=['heute','kalender','kunden','kurse','geld'];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'],WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
const MOL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const S={kunden:[],lektionen:[],kurse:[],ausgaben:[],cfg:{...DEF},view:'heute',cal:null,sel:null,year:new Date().getFullYear(),q:'',sheet:null,back:null,confirm:null,open:{},mode:'laden',drawn:null,user:undefined,unsubs:[]};
let db=null,dl=null,loadT=null,FB=null;
const ENV=window.APP_ENV==='test'?'test':'prod';
if(ENV==='test'){document.documentElement.classList.add('env-test');document.title='LL-Kurse TEST';document.querySelector('meta[name=theme-color]')?.setAttribute('content','#7f1414')}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=encodeURIComponent;
const p2=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const today=()=>iso(new Date());
const s2d=s=>{const [y,m,d]=(s||today()).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=s2d(s);d.setDate(d.getDate()+n);return iso(d)};
const fD=s=>{if(!s)return '';const d=s2d(s);return `${WD[d.getDay()]}, ${d.getDate()}. ${MO[d.getMonth()]}`};
const fDs=s=>{if(!s)return '';const d=s2d(s);return `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`};
const sep=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,"'");
const num=n=>{const v=Math.round((+n||0)*100)/100;const [a,b]=Math.abs(v).toFixed(2).split('.');return (v<0?'-':'')+sep(a)+'.'+b};
const num0=n=>{const v=Math.round(+n||0);return (v<0?'-':'')+sep(String(Math.abs(v)))};
const chf=n=>'CHF '+num(n);

function fail(e){const c=e?.code;toast(c==='invalid_argument'?'Keine Berechtigung zum Speichern':c==='quota_exceeded'?'Speicher voll':'Speichern fehlgeschlagen, bitte nochmals')}
async function put(col,obj){const {id,...data}=obj;
  if(!db){const a=S[col];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=obj;else a.push(obj);render();return true}
  {const a=S[col];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=obj;else a.push(obj)}
  try{await db.collection(col).doc(id).set(data);return true}catch(e){fail(e);return false}}
async function drop(col,id){if(!db){S[col]=S[col].filter(x=>x.id!==id);render();return}try{await db.collection(col).doc(id).delete()}catch(e){fail(e)}}
async function putCfg(c){if(!db){S.cfg={...DEF,...c};render();return true}try{await db.doc('config/main').set(c);return true}catch(e){fail(e);return false}}
async function updK(id,fn){const k=getK(id);if(!k)return false;const c=structuredClone(k);fn(c);return put('kurse',c)}
function subscribe(){const got=new Set();
  const ok=()=>{if(got.size>=5&&S.mode!=='ok'){clearTimeout(loadT);S.mode='ok'}};
  loadT=setTimeout(()=>{if(S.mode==='laden'){S.mode='langsam';render()}},10000);
  const err=e=>{clearTimeout(loadT);S.mode=e?.code==='permission-denied'?'fehler':'langsam';render()};
  ['kunden','lektionen','kurse','ausgaben'].forEach(c=>S.unsubs.push(db.collection(c).onSnapshot(sn=>{S[c]=sn.docs.map(d=>({...d.data(),id:d.id}));if(!sn.metadata.fromCache){got.add(c);ok()}render()},err)));
  S.unsubs.push(db.doc('config/main').onSnapshot(sn=>{S.cfg={...DEF,...(sn.exists?sn.data():{})};if(!sn.metadata.fromCache){got.add('cfg');ok()}render()},err))}
function unsubscribe(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];clearTimeout(loadT);['kunden','lektionen','kurse','ausgaben'].forEach(c=>S[c]=[]);S.cfg={...DEF}}

function events(){const ev=[];
  S.lektionen.forEach(l=>{const tp=tpName(l.treffpunkt),p=+l.personen||1,nr=l.status==='abgesagt'?0:lekNr(l);ev.push({t:'L',id:l.id,datum:l.datum,zeit:l.zeit,status:l.status||'geplant',bezahlt:l.bezahlt,zahlart:l.zahlart,betrag:l.betrag,titel:kName(l.kundeId),sub:[`bis ${bisOf(l)}`,l.technik,nr?`${nr}. Lektion`:'',p>1?`${p} Pers.`:'',tp!==tpDef()?tp:''].filter(Boolean).join(' · ')})});
  S.kurse.forEach(k=>{const tn=(k.teilnehmer||[]).filter(t=>!t.warte);const p=tn.reduce((s,t)=>s+(+t.personen||1),0);const n=(k.termine||[]).length;(k.termine||[]).forEach((t,i)=>ev.push({t:'K',id:k.id,datum:t.datum,zeit:t.zeit,status:'',titel:k.titel,sub:[`bis ${bisOf(t)}`,`Termin ${i+1} von ${n}`,k.technik,`${p} Pers.`].filter(Boolean).join(' · ')}))});
  return ev.sort((a,b)=>(a.datum+a.zeit).localeCompare(b.datum+b.zeit))}
function offen(){const r=[],t=today();
  S.lektionen.forEach(l=>{if(!l.bezahlt&&l.status!=='abgesagt'&&l.datum<=t)r.push({t:'L',id:l.id,kid:l.kundeId,datum:l.datum,titel:kName(l.kundeId),art:'Lektion',betrag:+l.betrag||0})});
  S.kurse.forEach(k=>(k.teilnehmer||[]).forEach(p=>{if(!p.bezahlt&&!p.warte)r.push({t:'K',id:k.id,kid:p.kundeId,datum:(k.termine||[])[0]?.datum||'',titel:kName(p.kundeId),art:k.titel,betrag:+p.betrag||0})}));
  return r.sort((a,b)=>a.datum.localeCompare(b.datum))}
function einnahmen(y){const r=[],Y=String(y);
  S.lektionen.forEach(l=>{if(l.bezahlt&&l.zahlart!==NV&&(l.bezahltAm||'').startsWith(Y))r.push({datum:l.bezahltAm,kunde:kName(l.kundeId),leistung:`Lektion ${fDs(l.datum)} ${vonBis(l)}${l.technik?', '+l.technik:''}, ${l.personen||1} Pers.`,zahlart:l.zahlart||'',betrag:+l.betrag||0})});
  S.kurse.forEach(k=>(k.teilnehmer||[]).forEach(p=>{if(p.bezahlt&&p.zahlart!==NV&&(p.bezahltAm||'').startsWith(Y))r.push({datum:p.bezahltAm,kunde:kName(p.kundeId),leistung:`Gruppenkurs ${k.titel}${(+p.personen||1)>1?', '+p.personen+' Pers.':''}${p.miete?', Mietmaterial':''}`,zahlart:p.zahlart||'',betrag:+p.betrag||0})}));
  return r.sort((a,b)=>a.datum.localeCompare(b.datum))}
const ausgabenY=y=>S.ausgaben.filter(a=>(a.datum||'').startsWith(String(y))).sort((a,b)=>a.datum.localeCompare(b.datum));
const PUF=30;
const parkFee=m=>m<=30?0:m<=240?(+S.cfg.park4||0):(+S.cfg.park10||0);
function trips(){const t=today(),g={},add=(datum,tp,von,bis,neu)=>{if(!datum||datum>t)return;const n=tpName(tp),key=datum+'|'+n;(g[key]=g[key]||{datum,ort:n,it:[]}).it.push({von:hm(von),bis:hm(bis),neu:!!neu})};
  S.lektionen.forEach(l=>{if(l.status!=='abgesagt')add(l.datum,l.treffpunkt,l.zeit,bisOf(l),l.neueFahrt)});
  S.kurse.forEach(k=>(k.termine||[]).forEach(x=>add(x.datum,k.treffpunkt,x.zeit,bisOf(x),false)));
  const a=+S.cfg.kmAnsatz||0,r=[];
  Object.values(g).forEach(G=>{G.it.sort((p,q)=>p.von-q.von);let c=null;G.it.forEach(i=>{if(!c||i.neu){c={datum:G.datum,ort:G.ort,von:i.von,bis:i.bis};r.push(c)}else c.bis=Math.max(c.bis,i.bis)})});
  r.forEach(x=>{x.km=tpKm(x.ort);x.kmHR=Math.round(x.km*20)/10;x.betrag=Math.round(x.km*2*a*100)/100;x.pflicht=tpPark(x.ort);x.pVon=Math.max(0,x.von-PUF);x.pBis=Math.min(1439,x.bis+PUF);x.pMin=x.pflicht?Math.max(0,Math.min(x.pBis,1020)-Math.max(x.pVon,120)):0;x.pTag=parkFee(x.pMin);x.park=x.pTag;x.wk=null});
  r.sort((p,q)=>p.datum.localeCompare(q.datum)||p.von-q.von);
  const W=+S.cfg.parkWoche||0,P=r.filter(x=>x.pTag>0),dn=d=>Math.round(s2d(d).getTime()/864e5),k=[];
  if(W&&P.length){const dp=[0],ch=[-1];P.forEach((x,i)=>{dp[i+1]=dp[i]+x.pTag;ch[i+1]=-1;for(let j=i;j>=0&&dn(x.datum)-dn(P[j].datum)<=6;j--){const v=dp[j]+W;if(v<dp[i+1]-0.001){dp[i+1]=v;ch[i+1]=j}}});
    let i=P.length;while(i>0){const j=ch[i];if(j<0){i--;continue}const w={von:P[j].datum,bis:addD(P[j].datum,6),betrag:W,n:i-j};for(let q=j;q<i;q++){P[q].park=0;P[q].wk=w}k.push(w);i=j}}
  return {r,k:k.sort((p,q)=>p.von.localeCompare(q.von))}}
function fahrten(y){const Y=String(y),{r,k}=trips();return {fa:r.filter(x=>x.datum.startsWith(Y)),wk:k.filter(x=>x.von.startsWith(Y))}}
const parkSum=(fa,wk)=>Math.round((fa.reduce((s,x)=>s+x.park,0)+wk.reduce((s,x)=>s+x.betrag,0))*100)/100;
const parkTxt=x=>x.wk?'Wochenkarte':x.pflicht?(x.park?'Parkieren '+chf(x.park):'Parkieren gratis'):'';
const kmSum=fa=>Math.round(fa.reduce((s,x)=>s+x.kmHR,0)*10)/10;
const groupSum=(arr,key,keys)=>{const m={};keys.forEach(k=>m[k]=0);arr.forEach(x=>{const k=x[key]||'Diverses';m[k]=(m[k]||0)+(+x.betrag||0)});return Object.entries(m).filter(([,v])=>v)};

async function newKunde(d){const vn=(d.nkVorname||'').trim(),nn=(d.nkNachname||'').trim(),tel=(d.nkTel||'').trim();if(!vn){toast('Bitte Vorname des neuen Kunden eingeben');return null}

const canPick=()=>!!(navigator.contacts&&navigator.contacts.select);
async function pick(multiple){try{const r=await navigator.contacts.select(['name','tel','email'],{multiple});return (r||[]).map(c=>({name:(c.name||[])[0]||'',tel:(c.tel||[])[0]||'',email:(c.email||[])[0]||'',ort:''})).filter(c=>c.name.trim())}catch(e){toast('Kontaktauswahl nicht möglich');return []}}
async function addMany(list){let n=0,dup=0;const seen=new Set(S.kunden.map(k=>fullName(k).toLowerCase())),tels=new Set(S.kunden.map(k=>telKey(k.tel)).filter(Boolean));
  for(const c of list){const name=c.name.trim();if(!name)continue;if(seen.has(name.toLowerCase())||(c.tel&&tels.has(telKey(c.tel)))){dup++;continue}seen.add(name.toLowerCase());if(c.tel&&telKey(c.tel))tels.add(telKey(c.tel));
    const nm=c.vorname?{vorname:c.vorname,nachname:c.nachname||''}:splitName(name);if(await put('kunden',{id:uid(),...nm,name:[nm.vorname,nm.nachname].filter(Boolean).join(' ')||name,tel:c.tel||'',email:c.email||'',ort:c.ort||'',notiz:'',erstellt:today()}))n++}
  toast(`${n} ${n===1?'Kunde':'Kunden'} übernommen${dup?`, ${dup} schon vorhanden`:''}`)}

  const list=cards.map(c=>{const nn=val(c,'N').split(';');let name=val(c,'FN');if(!name)name=[nn[1],nn[0]].filter(Boolean).join(' ');return {name:name.trim(),vorname:(nn[1]||'').trim(),nachname:(nn[0]||'').trim(),tel:val(c,'TEL'),email:val(c,'EMAIL'),ort:(val(c,'ADR').split(';')[3]||'').trim()}});

  csvF:()=>{const {fa,wk}=fahrten(S.year),a=(+S.cfg.kmAnsatz||0).toFixed(2);offer(`Fahrten_${S.year}.csv`,csv([['Datum','Treffpunkt','km einfach','km hin und zurück','Ansatz CHF/km','Fahrt CHF','Parkiert von','Parkiert bis','Parkgebühr CHF','Bemerkung'],...[...fa.map(x=>({d:x.datum,r:[fDs(x.datum),x.ort,num1(x.km),num1(x.kmHR),a,x.betrag.toFixed(2),x.pflicht?hmS(x.pVon):'',x.pflicht?hmS(x.pBis):'',x.park.toFixed(2),x.wk?'Wochenkarte':'']})),...wk.map(w=>({d:w.von,r:[fDs(w.von),'Wochenkarte Parkieren','','','','0.00','','',w.betrag.toFixed(2),`gültig ${fDs(w.von)} bis ${fDs(w.bis)}`]}))].sort((p,q)=>p.d.localeCompare(q.d)).map(x=>x.r)]))},
  seed:async()=>{if(ENV!=='test')return;closeSheet();await seedTest();toast('Testdaten geladen')},
  wipe:()=>{if(ENV!=='test')return;ask('Alle Testdaten löschen?','Alles löschen',async()=>{for(const c of ['kunden','lektionen','kurse','ausgaben'])for(const x of [...S[c]])await drop(c,x.id);toast('Testdaten gelöscht')})},
  backup:()=>offer(`Langlaufspass_Sicherung_${today()}.json`,JSON.stringify({exportiert:new Date().toISOString(),config:S.cfg,kunden:S.kunden,lektionen:S.lektionen,kurse:S.kurse,ausgaben:S.ausgaben},null,1))
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,h=F[f.dataset.form];if(h)h(f)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='kq'){S.q=t.value;$('#klist').innerHTML=kList()}else if(t.id==='fBetrag'&&t.form)t.form.dataset.manual='1';else if(t.id==='fZeit'&&t.form&&t.value){const f=t.form;f.elements.bis.value=hmS(hm(t.value)+Math.round((+f.dataset.dur||1)*60));recalc(f)}else if(t.id==='fBis'&&t.form)recalc(t.form);else if(t.id==='fDatum'&&t.form){const w=t.form.querySelector('#fNeuWrap');if(w){const n=dayCount(t.value,t.form.elements.id.value);w.hidden=!n;if(!n)w.querySelector('input').checked=false}}else if(t.id==='fNkTel'||t.id==='fcTel')telHit(t)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='fKunde'){const n=t.form.querySelector('.newk');n.hidden=t.value!=='__neu';const i=t.form.querySelector('#kInfo');if(i)i.innerHTML=kInfo(t.value);if(!n.hidden)t.form.elements.nkVorname.focus()}else if(t.id==='vcf'){importVcf(t.files[0]).catch(()=>toast('Datei konnte nicht gelesen werden')).finally(()=>t.value='')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
const MIME={pdf:'application/pdf',csv:'text/csv;charset=utf-8',json:'application/json'};
dl={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:MIME[filename.split('.').pop()]||'application/octet-stream'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return {status:'saved'}}};
addEventListener('hashchange',route);
route();
function boot(){const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/HIER/.test(cfg.apiKey)){S.mode='setup';S.user=null;render();return}
  try{FB=window.LLFB.start(cfg)}catch(e){S.mode='setup';S.user=null;render();return}
  FB.onWriteError(e=>toast(e?.code==='permission-denied'?'Keine Berechtigung zum Speichern':'Speichern fehlgeschlagen ('+(e?.code||'Fehler')+')'));
  FB.onUser(u=>{S.user=u||null;if(u&&!db){db=FB.db;S.mode='laden';subscribe()}else if(!u&&db){unsubscribe();db=null}render()})}
window.LLFB?boot():addEventListener('llfb',boot,{once:true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
