<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#011627">
<title>Langlaufspass Kurse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday work tool for a ski instructor: calm, quick, big touch targets
   IDEA the Langlaufspass.ch brand: navy night band with the Churfirsten logo, cyan loipe accent
   PICTURE the white Churfirsten logo with cyan and pink skaters in the header band
   COLOUR white ground, navy ink #011627, brand cyan #26cfc8, pink #db1168 for money and actions, Esther-purple #a656ce for group courses
   TYPE Anton wordmark, Roboto Condensed for titles, times and figures, Montserrat for text (as on langlaufspass.ch)
   LAYOUT phone: band with title left and logo right, list, fixed tabs and pink button; wider: same column, max 760px centred */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#07121c);--ink:light-dark(#011627,#e9f3f6);--mut:light-dark(#566673,#9aadb8);--line:light-dark(#e2e8ec,#1c2e3b);--surf:light-dark(#f3f7f8,#0f1f2b);--sky:#011627;--brand:#26cfc8;--cy:light-dark(#0b8a85,#4fe3dc);--cybg:light-dark(#dcf6f4,#0d3433);--pk:light-dark(#db1168,#ff4f97);--pkbg:light-dark(#fde5ef,#3a1226);--pu:light-dark(#9447c2,#c89be6);--pubg:light-dark(#f2e8f9,#2c1a3a)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Montserrat,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.cond{font-family:"Roboto Condensed","Arial Narrow",sans-serif}
a{color:var(--cy)}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.band{background:var(--sky);color:#fff;position:relative;border-bottom:5px solid var(--brand)}
.band-in{max-width:760px;margin:0 auto;padding:8px 16px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:400 19px/1 Anton,Impact,"Arial Narrow",sans-serif;letter-spacing:.03em}
.gear{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center}
.gear svg{width:24px;height:24px}
h1{font:700 clamp(28px,8.4vw,44px)/1.02 "Roboto Condensed","Arial Narrow",sans-serif;text-transform:uppercase;margin:6px 0 2px;text-wrap:balance}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.logo{display:block;width:clamp(92px,24vw,150px);height:auto;margin:2px -4px -6px 0}
.sub{margin:2px 0 0;font-size:14px;color:#a7f3f0}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.figs b{display:block;font-size:34px;line-height:1;white-space:nowrap}
.figs span{font-size:13px;font-weight:500;color:#a7f3f0}
.figs .pk span{background:var(--pk);color:#fff;padding:1px 7px;border-radius:6px}
.ridge{display:block;width:100%;height:max(84px,11vw);margin-top:-6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 160px}
.day{font:600 14px/1.2 Montserrat,sans-serif;color:var(--mut);margin:22px 0 4px}
.empty{color:var(--mut);margin:8px 0 4px}
.ev,.li{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;color:var(--ink)}
.li{grid-template-columns:44px minmax(0,1fr) auto}
.tm{font-size:30px;font-weight:700;line-height:1;color:var(--cy);white-space:nowrap}
.ev.k .tm{color:var(--pu)}
.chip.grp{background:var(--pubg);color:var(--pu);border-color:transparent}
.ev.x b,.ev.x .tm{text-decoration:line-through;color:var(--mut)}
.ev b,.li b{display:block;font-weight:600;font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev small,.li small,.card small{display:block;color:var(--mut);font-size:14px;line-height:1.35}
.ev-r{display:grid;gap:5px;justify-items:end;text-align:right}
.amt{font-size:18px;font-weight:600;white-space:nowrap}
.pkt{color:var(--pk)}
.chip{font-size:13px;font-weight:600;line-height:1.5;padding:1px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--mut)}
.chip.paid{background:var(--cybg);color:var(--cy);border-color:transparent}
.chip.open{background:var(--pkbg);color:var(--pk);border-color:transparent}
.chip.off{text-decoration:line-through}
.av{width:44px;height:44px;border-radius:50%;background:var(--cybg);color:var(--cy);display:grid;place-items:center;font-size:18px;font-weight:700}
.due{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--pkbg);color:var(--ink);text-decoration:none;min-height:48px}
.due b{font-weight:600}
.due span{color:var(--pk);font-size:20px;font-weight:700;white-space:nowrap}
.note{background:var(--pkbg);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:15px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;line-height:1.2}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#011627}
.btn.pk{background:var(--pk);border-color:var(--pk);color:#fff}
.btn.ghost{background:none}
.btn.danger{background:none;color:var(--pk);border-color:transparent}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mt{margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.fm{display:grid;gap:14px}
.f{display:grid;gap:5px;font-size:14px;font-weight:600;color:var(--mut)}
.f input,.f select,.f textarea,.trow input,.trow select,.search input{font-size:16px;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;font-weight:400}
.f textarea{resize:vertical;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chips button{min-height:44px;min-width:52px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#011627}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;padding:4px 0 6px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surf);font-size:22px;line-height:1}
.step output{font:700 26px/1 "Roboto Condensed","Arial Narrow",sans-serif;min-width:2ch;text-align:center;color:var(--ink)}
.hint{color:var(--mut);font-size:14px;margin:6px 0 0}
.search{margin-top:16px}
.calmode{margin-top:14px}.calmode button{flex:1}
h2.day .btn{margin-left:8px;vertical-align:middle}
.dg{position:relative;margin-top:4px;border-top:1px solid var(--line)}
.dg-w{position:absolute;left:52px;right:0;background:var(--surf);border-radius:6px}
.dg-h{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}.dg-h span{position:absolute;top:-9px;left:0;font-size:12px;color:var(--mut);background:var(--bg);padding-right:4px;font-family:'Roboto Condensed',sans-serif}
.dg-f{position:absolute;left:56px;right:4px;border:1.5px dashed var(--cy);border-radius:8px;background:transparent;color:var(--cy);font:inherit;font-size:13px;font-weight:600;text-align:left;padding:2px 8px;cursor:pointer;display:flex;align-items:flex-start;opacity:.85}
.dg-e{position:absolute;border:0;border-left:4px solid var(--cy);border-radius:8px;background:var(--cybg);color:var(--ink);font:inherit;text-align:left;padding:3px 6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:0;line-height:1.2;z-index:1}
.dg-e b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dg-e small{font-size:12px;color:var(--mut);overflow:hidden}
.dg-e.k{border-left-color:#A656CE;background:light-dark(#f2e8f8,#2a1a33)}.dg-e.b{border-left-color:var(--mut);background:repeating-linear-gradient(135deg,var(--surf) 0 6px,var(--line) 6px 8px)}.dg-e.m{border-left-color:#DB1168;background:var(--pkbg)}
.daynav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:12px}.daynav b{text-align:center;font-size:20px;line-height:1.1}.daynav .btn{padding:0 10px;font-size:15px}
.calbar{display:flex;gap:8px;align-items:center;margin-top:14px}.calbar .calmode{flex:1;margin-top:0}.calbar .btn[disabled]{opacity:.45}
.mini{position:fixed;top:0;left:0;right:0;z-index:6;background:var(--sky);color:#fff;border-bottom:3px solid var(--brand);display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px 12px;transform:translateY(-110%);transition:transform .18s ease;visibility:hidden}
.mini.on{transform:none;visibility:visible}.mini img{width:34px;height:34px;border-radius:8px}.mini span{flex:1;min-width:0;display:flex;flex-direction:column}.mini b{font:700 18px/1.1 "Roboto Condensed",sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini small{font-size:12px;color:#a7f3f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.cal .wd{font-size:13px;color:var(--mut);text-align:center;font-weight:600}
.cal button{min-height:50px;border:0;border-radius:10px;background:var(--surf);color:var(--ink);display:grid;justify-items:center;align-content:center;gap:4px;font-weight:600;padding:4px 0}
.cal button.out{opacity:.35}
.cal button.td{box-shadow:inset 0 0 0 2px var(--cy)}
.cal button[aria-pressed=true]{background:var(--brand);color:#011627}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--cy)}
.dots i.k{background:var(--pu)}
.cal button[aria-pressed=true] .dots i{background:#011627}
.card{display:grid;gap:6px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:10px}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card-h b{font-size:19px;font-weight:600}
.fill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.fill .cond{font-size:18px;font-weight:600;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--surf);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--cy);border-radius:5px}
.months .bar{display:block}
.bar.thin{height:4px;margin-top:4px;box-shadow:none;background:none}
.bar.thin i{background:var(--mut)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:10px;margin-top:16px}
.big div{background:var(--surf);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mut);font-weight:500}
.big b{display:block;font:700 clamp(24px,7vw,32px)/1.1 "Roboto Condensed","Arial Narrow",sans-serif;color:var(--ink);white-space:nowrap}
.big .pk b{color:var(--pk)}
.big .main{background:var(--sky);color:#a7f3f0;grid-column:1/-1;box-shadow:inset 0 -4px 0 var(--brand)}
.big.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.big.three b{font-size:26px}
.big .main b{color:#fff}
.months{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:8px 12px;align-items:center;margin-top:8px}
.months span{font-size:15px}
.months .v{text-align:right;white-space:nowrap;font-size:17px;font-weight:600}
.months .v small{display:block;color:var(--mut);font-size:13px;font-weight:500}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t td{padding:7px 0;border-bottom:1px solid var(--line)}
.t td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t tr.sum td{font-weight:700;border-bottom:0}
section.s{margin-top:22px}
section.s h3{font:600 15px/1.2 Montserrat,sans-serif;color:var(--mut);margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin-top:12px;font-size:16px}
.kv span{color:var(--mut)}
.kv b{font-weight:600}
.kv b.cond{font-size:22px}
.trm{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trm .tm{font-size:26px}
.trm b{display:block;font-weight:600}
.trm small{display:block;color:var(--mut);font-size:14px}
.trm .row{grid-column:2}
.tn{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.tn b{font-weight:600}
.tn small{display:block;color:var(--mut);font-size:14px}
.trow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;margin-bottom:6px}
.trow input,.trow select{padding:8px}
.tprow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px;margin-bottom:14px;align-items:center}
.tpsub{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tprow .tpsub input[data-f=km]{width:5.2em;flex:none}.tpsub span{color:var(--mut);font-size:14px}
.free{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;width:100%;text-align:left;border:1.5px dashed var(--line);border-radius:12px;background:none;color:inherit;font:inherit;padding:8px 10px;margin:6px 0;align-items:start;cursor:pointer}
.free .tm{font-size:20px;color:var(--mut)}.free b{color:var(--cy)}.free small{display:block;color:var(--mut)}
.ev.blk .tm{color:var(--mut)}
.warn{background:var(--pkbg);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px}.okay{color:var(--cy);margin:6px 0;font-weight:600}
.mfoto{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--surf);margin-bottom:8px}.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
form[data-lang="1"] .only-t{display:none!important}form:not([data-lang="1"]) .only-lz{display:none!important}
.mvor{grid-column:1/-1;margin:0;font-size:14px;font-weight:600;color:var(--cy)}.mi .mv{font-style:normal;color:var(--cy)}
.massign{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:6px 8px;align-items:center}.massign:empty{display:none}.massign span{font-size:13px;color:var(--mut)}
.massign select{font-size:15px;min-height:42px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.svrow{display:grid;grid-template-columns:minmax(0,1fr) 5.5em 44px;gap:6px;margin-bottom:6px}
.svrow input{font-size:16px;min-height:46px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.mrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.mrow-h{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px}
.mrow-h input{font-size:16px;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.mrow .f span,.mrow label.f{font-size:13px}
form[data-art=miete] .only-l{display:none!important}form:not([data-art=miete]) .only-m{display:none!important}
.miet{background:var(--cybg);border-radius:14px;padding:12px 14px;margin-top:14px}.miet h3{margin:0 0 6px;font-size:16px}
.msum{margin:0 0 4px;font-size:15px}
.mi{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;color:inherit;font:inherit;min-height:44px;cursor:pointer}
.mi .cond{font-size:18px;color:var(--cy)}.mi small{color:var(--mut)}.mi .ml{display:block;color:var(--ink);font-size:14px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:16px;cursor:pointer}.chk input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--cy)}
.tprow input:not([type=checkbox]){font-size:16px;min-height:46px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
details summary{cursor:pointer;color:var(--cy);font-weight:600;min-height:44px;display:flex;align-items:center}
.kv small.hint{display:inline;margin:0 0 0 6px}
.x{width:44px;height:44px;border:0;border-radius:12px;background:var(--surf);color:var(--ink);font-size:22px;line-height:1;flex:none}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-h h2{font:700 30px/1.05 "Roboto Condensed","Arial Narrow",sans-serif;margin:2px 0 4px;text-wrap:balance}
.sh-h p{margin:0;color:var(--mut)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(4,14,20,.5)}
.sh-box{position:relative;width:100%;max-width:760px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sh-box::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sh-box{animation:none}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{display:grid;justify-items:center;gap:1px;padding:8px 0 6px;min-height:58px;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a[aria-current=page]{color:var(--cy)}
nav.tabs svg{width:24px;height:24px}
.fab{text-transform:uppercase;letter-spacing:.02em;position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;height:56px;padding:0 22px;border:0;border-radius:28px;background:var(--pk);color:#fff;font-size:20px;font-weight:700;box-shadow:0 4px 10px -4px rgba(209,18,108,.7)}
.fab[hidden]{display:none}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:min(90vw,420px);font-weight:500;text-align:center}
.toast[hidden]{display:none}
.env-test{--sky:#7f1414}
.envtag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:6px;background:#fff;color:#7f1414;font:400 14px/1.3 Anton,Impact,sans-serif;letter-spacing:.06em;vertical-align:2px}
@media (max-width:380px){.tm{font-size:26px}.figs b{font-size:28px}}
</style>
</head>
<body>
<div id="mini" class="mini" aria-hidden="true"></div>
<main id="main"></main>

function mVor(r,niv){const cm=+r.cm||0;if(!cm)return null;const kg=+r.kg||0,sk=r.stil==='Skating',beg=niv==='Einsteiger';
  let lo=cm+(sk?(beg?8:10):20),hi=cm+(sk?(beg?12:15):(beg?25:30));

  const f=cm*(sk?0.89:0.83),st=beg?Math.floor(f/5)*5:Math.ceil(f/5)*5;return {lo,hi,st}}

function matTarget(typ,r,niv){if(typ==='schuhe')return +String(r.schuh||'').replace(',','.')||0;const v=mVor(r,niv);if(!v)return 0;return typ==='stoecke'?v.st:(v.lo+v.hi)/2}

function formDates(f){if(f.dataset.form==='T'){const k=getK(f.elements.kurs.value);return [...new Set((k?.termine||[]).map(t=>t.datum))]}const d=f.elements.datum?.value;if(!d)return [];const t=f.dataset.art!=='miete'?1:f.dataset.lang==='1'?Math.max(1,(f.elements.rueck.value?dayDiff(d,f.elements.rueck.value):0)+1):Math.max(1,+f.elements.tage.value||1);return Array.from({length:t},(_,i)=>addD(d,i))}

function mAssign(f){const rows=f.querySelectorAll('.mrow');if(!rows.length)return;const dates=formDates(f),ex=formSrc(f),niv=f.elements.niveau?.value||f.dataset.niv||'';
  rows.forEach(row=>{const r=mReadRow(row),box=row.querySelector('.massign');if(!box)return;const v=mVor(r,niv),vt=v?vorTxt(r,v):'';

function fail(e){const c=e?.code;toast(c==='invalid_argument'?'Keine Berechtigung zum Speichern':c==='quota_exceeded'?'Speicher voll':'Speichern fehlgeschlagen, bitte nochmals')}
async function put(col,obj){const {id,...data}=obj;
  if(!db){const a=S[col];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=obj;else a.push(obj);render();return true}
  {const a=S[col];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=obj;else a.push(obj)}
  try{await db.collection(col).doc(id).set(data);return true}catch(e){fail(e);return false}}
async function drop(col,id){if(!db){S[col]=S[col].filter(x=>x.id!==id);render();return}try{await db.collection(col).doc(id).delete()}catch(e){fail(e)}}
async function putCfg(c){if(!db){S.cfg={...DEF,...c};render();return true}try{await db.doc('config/main').set(c);return true}catch(e){fail(e);return false}}
async function updK(id,fn){const k=getK(id);if(!k)return false;const c=structuredClone(k);fn(c);return put('kurse',c)}
function subscribe(){const got=new Set();
  const ok=()=>{if(got.size>=COLS.length+1&&S.mode!=='ok'){clearTimeout(loadT);S.mode='ok'}};
  loadT=setTimeout(()=>{if(S.mode==='laden'){S.mode='langsam';render()}},10000);
  const err=e=>{clearTimeout(loadT);S.mode=e?.code==='permission-denied'?'fehler':'langsam';render()};
  COLS.forEach(c=>S.unsubs.push(db.collection(c).onSnapshot(sn=>{S[c]=sn.docs.map(d=>({...d.data(),id:d.id}));if(!sn.metadata.fromCache){got.add(c);ok()}render()},err)));
  S.unsubs.push(db.doc('config/main').onSnapshot(sn=>{S.cfg={...DEF,...(sn.exists?sn.data():{})};if(!sn.metadata.fromCache){got.add('cfg');ok()}render()},err))}
function unsubscribe(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];clearTimeout(loadT);COLS.forEach(c=>S[c]=[]);S.cfg={...DEF}}

function events(){const ev=[];
  S.lektionen.forEach(l=>{const m=mList(l).length,base={t:'L',id:l.id,datum:l.datum,zeit:l.zeit,status:l.status||'geplant',bezahlt:l.bezahlt,zahlart:l.zahlart,betrag:l.betrag,titel:kName(l.kundeId)};
    if(isMiete(l)){ev.push({...base,sub:[l.lang?`Langzeitmiete bis ${fDs(addD(l.datum,(+l.tage||1)-1))}`:'Nur Miete',`${m} Pers.`,!l.lang&&(+l.tage||1)>1?`${l.tage} Tage`:''].filter(Boolean).join(' · ')});return}
    const tp=tpName(l.treffpunkt),p=+l.personen||1,nr=l.status==='abgesagt'?0:lekNr(l);ev.push({...base,sub:[`bis ${bisOf(l)}`,l.technik,nr?`${nr}. Lektion`:'',p>1?`${p} Pers.`:'',m?`Miete ${m}`:'',tp!==tpDef()?tp:''].filter(Boolean).join(' · ')})});
  S.kurse.forEach(k=>{const tn=(k.teilnehmer||[]).filter(t=>!t.warte);const p=tn.reduce((s,t)=>s+(+t.personen||1),0);const n=(k.termine||[]).length;(k.termine||[]).forEach((t,i)=>ev.push({t:'K',id:k.id,datum:t.datum,zeit:t.zeit,status:'',titel:k.titel,sub:[`bis ${bisOf(t)}`,`Termin ${i+1} von ${n}`,k.technik,`${p} Pers.`].filter(Boolean).join(' · ')}))});
  return ev.sort((a,b)=>(a.datum+a.zeit).localeCompare(b.datum+b.zeit))}
function offen(){const r=[],t=today();
  S.lektionen.forEach(l=>{if(!l.bezahlt&&l.status!=='abgesagt'&&l.datum<=t)r.push({t:'L',id:l.id,kid:l.kundeId,datum:l.datum,titel:kName(l.kundeId),art:isMiete(l)?'Mietmaterial':'Lektion',betrag:+l.betrag||0})});
  S.kurse.forEach(k=>(k.teilnehmer||[]).forEach(p=>{if(!p.bezahlt&&!p.warte)r.push({t:'K',id:k.id,kid:p.kundeId,datum:(k.termine||[])[0]?.datum||'',titel:kName(p.kundeId),art:k.titel,betrag:+p.betrag||0})}));
  S.service.forEach(v=>{if(!v.bezahlt&&(v.status==='abgeholt'||v.status==='fertig'||(v.fertig||v.datum)<=t))r.push({t:'S',id:v.id,kid:v.kundeId,datum:v.fertig||v.datum,titel:kName(v.kundeId),art:'Skiservice',betrag:+v.betrag||0})});
  return r.sort((a,b)=>a.datum.localeCompare(b.datum))}
function einnahmen(y){const r=[],Y=String(y);
  S.lektionen.forEach(l=>{if(l.bezahlt&&l.zahlart!==NV&&(l.bezahltAm||'').startsWith(Y))r.push({datum:l.bezahltAm,kunde:kName(l.kundeId),leistung:isMiete(l)?(l.lang?`Langzeitmiete ${fDs(l.datum)} bis ${fDs(addD(l.datum,(+l.tage||1)-1))}, ${mList(l).length} Pers.`:`Mietmaterial ${fDs(l.datum)}, ${mList(l).length} Pers.${(+l.tage||1)>1?`, ${l.tage} Tage`:''}`):`Lektion ${fDs(l.datum)} ${vonBis(l)}${l.technik?', '+l.technik:''}, ${l.personen||1} Pers.${mList(l).length?`, Miete ${mList(l).length} Pers.`:''}`,zahlart:l.zahlart||'',betrag:+l.betrag||0,miete:isMiete(l)?(+l.betrag||0):Math.min(+l.mietBetrag||0,+l.betrag||0)})});
  S.kurse.forEach(k=>(k.teilnehmer||[]).forEach(p=>{if(p.bezahlt&&p.zahlart!==NV&&(p.bezahltAm||'').startsWith(Y))r.push({datum:p.bezahltAm,kunde:kName(p.kundeId),leistung:`Gruppenkurs ${k.titel}${(+p.personen||1)>1?', '+p.personen+' Pers.':''}${mList(p).length?`, Mietmaterial ${mList(p).length} Pers.`:''}`,zahlart:p.zahlart||'',betrag:+p.betrag||0,miete:Math.min(mList(p).length*kMietAdd(k),+p.betrag||0)})}));
  S.service.forEach(v=>{if(v.bezahlt&&v.zahlart!==NV&&(v.bezahltAm||'').startsWith(Y))r.push({datum:v.bezahltAm,kunde:kName(v.kundeId),leistung:`Skiservice ${fDs(v.datum)}: ${(v.leistungen||[]).join(', ')}, ${v.paare||1} Paar`,zahlart:v.zahlart||'',betrag:+v.betrag||0,service:+v.betrag||0})});
  return r.sort((a,b)=>a.datum.localeCompare(b.datum))}
const ausgabenY=y=>S.ausgaben.filter(a=>(a.datum||'').startsWith(String(y))).sort((a,b)=>a.datum.localeCompare(b.datum));
const PUF=30;
const parkFee=m=>m<=30?0:m<=240?(+S.cfg.park4||0):(+S.cfg.park10||0);
function trips(){const t=today(),g={},add=(datum,tp,von,bis,neu)=>{if(!datum||datum>t)return;const n=tpName(tp),key=datum+'|'+n;(g[key]=g[key]||{datum,ort:n,it:[]}).it.push({von:hm(von),bis:hm(bis),neu:!!neu})};
  S.lektionen.forEach(l=>{if(l.status!=='abgesagt'&&!isMiete(l))add(l.datum,l.treffpunkt,l.zeit,bisOf(l),l.neueFahrt)});
  S.kurse.forEach(k=>(k.termine||[]).forEach(x=>add(x.datum,k.treffpunkt,x.zeit,bisOf(x),false)));
  const a=+S.cfg.kmAnsatz||0,r=[];
  Object.values(g).forEach(G=>{G.it.sort((p,q)=>p.von-q.von);let c=null;G.it.forEach(i=>{if(!c||i.neu){c={datum:G.datum,ort:G.ort,von:i.von,bis:i.bis};r.push(c)}else c.bis=Math.max(c.bis,i.bis)})});
  r.forEach(x=>{x.km=tpKm(x.ort);x.kmHR=Math.round(x.km*20)/10;x.betrag=Math.round(x.km*2*a*100)/100;x.pflicht=tpPark(x.ort);x.pVon=Math.max(0,x.von-PUF);x.pBis=Math.min(1439,x.bis+PUF);x.pMin=x.pflicht?Math.max(0,Math.min(x.pBis,1020)-Math.max(x.pVon,120)):0;x.pTag=parkFee(x.pMin);x.park=x.pTag;x.wk=null});
  r.sort((p,q)=>p.datum.localeCompare(q.datum)||p.von-q.von);
  const W=+S.cfg.parkWoche||0,P=r.filter(x=>x.pTag>0),dn=d=>Math.round(s2d(d).getTime()/864e5),k=[];
  if(W&&P.length){const dp=[0],ch=[-1];P.forEach((x,i)=>{dp[i+1]=dp[i]+x.pTag;ch[i+1]=-1;for(let j=i;j>=0&&dn(x.datum)-dn(P[j].datum)<=6;j--){const v=dp[j]+W;if(v<dp[i+1]-0.001){dp[i+1]=v;ch[i+1]=j}}});
    let i=P.length;while(i>0){const j=ch[i];if(j<0){i--;continue}const w={von:P[j].datum,bis:addD(P[j].datum,6),betrag:W,n:i-j};for(let q=j;q<i;q++){P[q].park=0;P[q].wk=w}k.push(w);i=j}}
  return {r,k:k.sort((p,q)=>p.von.localeCompare(q.von))}}
function fahrten(y){const Y=String(y),{r,k}=trips();return {fa:r.filter(x=>x.datum.startsWith(Y)),wk:k.filter(x=>x.von.startsWith(Y))}}
const parkSum=(fa,wk)=>Math.round((fa.reduce((s,x)=>s+x.park,0)+wk.reduce((s,x)=>s+x.betrag,0))*100)/100;
const parkTxt=x=>x.wk?'Wochenkarte':x.pflicht?(x.park?'Parkieren '+chf(x.park):'Parkieren gratis'):'';
const kmSum=fa=>Math.round(fa.reduce((s,x)=>s+x.kmHR,0)*10)/10;
const groupSum=(arr,key,keys)=>{const m={};keys.forEach(k=>m[k]=0);arr.forEach(x=>{const k=x[key]||'Diverses';m[k]=(m[k]||0)+(+x.betrag||0)});return Object.entries(m).filter(([,v])=>v)};

function mietTag(datum){const it=[],ret=[];
  S.lektionen.forEach(l=>{if(l.status==='abgesagt')return;const ms=mList(l);if(!ms.length)return;const tg=+l.tage||1;
    if(l.datum===datum)it.push({zeit:l.zeit,wer:kName(l.kundeId),was:isMiete(l)?mietTxt(l):`Lektion ${vonBis(l)} · ${tpName(l.treffpunkt)}`,ms,niv:l.niveau||'',act:'openL',id:l.id});
    else if(isMiete(l)&&tg>1&&addD(l.datum,tg-1)===datum)ret.push({wer:kName(l.kundeId),n:ms.length,act:'openL',id:l.id})});
  S.kurse.forEach(k=>(k.termine||[]).forEach(t=>{if(t.datum!==datum)return;(k.teilnehmer||[]).filter(p=>!p.warte&&mList(p).length).forEach(p=>it.push({zeit:t.zeit,wer:kName(p.kundeId),was:k.titel,niv:k.niveau||'',ms:mList(p).map(r=>({...r,stil:r.stil||(k.technik==='Skating'?'Skating':'Klassisch')})),act:'openK',id:k.id}))}));
  return {it:it.sort((a,b)=>a.zeit.localeCompare(b.zeit)),ret}}
function mietBox(datum,title){const {it,ret}=mietTag(datum);if(!it.length&&!ret.length)return '';
  const su={};it.forEach(x=>x.ms.forEach(r=>{const st=r.stil||'Klassisch';su[st]=su[st]||{ski:0,schuhe:0,stoecke:0};MITEM.forEach(([k])=>{if(r[k])su[st][k]++})}));
  const n=it.reduce((a,x)=>a+x.ms.length,0);
  return `<section class="miet"><h3>${esc(title)}${n?` · ${n} ${n===1?'Person':'Personen'}`:''}</h3>${Object.entries(su).map(([st,c])=>`<p class="msum"><b>${st}:</b> ${MITEM.filter(([k])=>c[k]).map(([k,t])=>`${c[k]}× ${t}`).join(' · ')}</p>`).join('')}${it.map(x=>`<button class="mi" type="button" data-act="${x.act}" data-id="${x.id}"><span class="cond">${esc(x.zeit)}</span><span><b>${esc(x.wer)}</b> <small>${esc(x.was)}</small>${x.ms.map(r=>{const v=mVor(r,x.niv||''),t=v?vorTxt(r,v,true):'';return `<small class="ml">${esc(mDesc(r))}${t?` <em class="mv">· Vorschlag ${esc(t)}</em>`:''}</small>`}).join('')}</span></button>`).join('')}${ret.map(x=>`<button class="mi" type="button" data-act="${x.act}" data-id="${x.id}"><span class="cond">↩</span><span><b>${esc(x.wer)}</b> <small>Rückgabe Mietmaterial, ${x.n} Pers.</small></span></button>`).join('')}</section>`}
const mrow=(r,i)=>`<div class="mrow" data-ski="${esc(r.skiId||'')}" data-schuhe="${esc(r.schuheId||'')}" data-stoecke="${esc(r.stoeckeId||'')}"><div class="mrow-h"><input data-m="n" aria-label="Person" placeholder="Person ${i+1} (Name, optional)" value="${esc(r.n||'')}"><button type="button" class="x" data-act="mDel" aria-label="Person entfernen">×</button></div><div class="seg">${STIL.map(st=>`<button type="button" data-act="mStil" data-v="${st}" aria-pressed="${(r.stil||'Klassisch')===st}">${st}</button>`).join('')}</div><div class="chips">${MITEM.map(([k,t])=>`<button type="button" data-act="mItem" data-k="${k}" aria-pressed="${r[k]!==false}">${t}</button>`).join('')}</div><div class="grid3"><label class="f">Grösse cm<input data-m="cm" type="number" inputmode="numeric" min="50" max="230" value="${esc(r.cm||'')}"></label><label class="f">Gewicht kg<input data-m="kg" type="number" inputmode="numeric" min="10" max="200" value="${esc(r.kg||'')}"></label><label class="f">Schuhgr.<input data-m="schuh" inputmode="decimal" value="${esc(r.schuh||'')}"></label></div><div class="massign"></div></div>`;
const mEditor=(rows,hint)=>`<div class="f"><span>Mietmaterial (pro Person)</span><div id="mrows">${rows.map(mrow).join('')}</div><button type="button" class="btn ghost" data-act="mAdd">+ Person mit Mietmaterial</button><p class="hint" style="margin:6px 0 0">${hint}</p></div>`;
const mReadRow=r=>{const o={stil:r.querySelector('[data-act=mStil][aria-pressed=true]')?.dataset.v||'Klassisch'};r.querySelectorAll('[data-m]').forEach(i=>o[i.dataset.m]=i.value.trim());r.querySelectorAll('[data-act=mItem]').forEach(b=>o[b.dataset.k]=b.getAttribute('aria-pressed')==='true');MTYP.forEach(([k])=>o[k+'Id']=o[k]?(r.dataset[k]||''):'');return o};

const mDup=ms=>{const c={};return ms.some(r=>MTYP.some(([k])=>{const id=r[k+'Id'];if(!id)return false;c[id]=(c[id]||0)+1;return c[id]>(+getM(id)?.anzahl||1)}))};
const mBad=ms=>ms.some(r=>!MITEM.some(([k])=>r[k]));

const WDS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDH={nie:'Einmalig',taeglich:'Jeden Tag',woechentlich:'Jede Woche'};
function blocksOn(d){const wd=s2d(d).getDay();return S.blocker.filter(b=>b.datum&&d>=b.datum&&!(b.bisDatum&&d>b.bisDatum)&&(b.wdh==='taeglich'||(b.wdh==='woechentlich'?s2d(b.datum).getDay()===wd:d===b.datum)))}
function busy(d,ex){const r=[];
  S.lektionen.forEach(l=>{if(l.datum===d&&l.status!=='abgesagt'&&!isMiete(l)&&l.id!==ex)r.push({von:hm(l.zeit),bis:hm(bisOf(l)),titel:kName(l.kundeId)})});
  S.kurse.forEach(k=>{if(k.id!==ex)(k.termine||[]).forEach(t=>{if(t.datum===d)r.push({von:hm(t.zeit),bis:hm(bisOf(t)),titel:k.titel})})});
  blocksOn(d).forEach(b=>r.push({von:hm(b.zeit),bis:hm(b.bis),titel:b.titel||'Blockzeit'}));
  return r.sort((a,b)=>a.von-b.von)}
const clash=(d,von,bis,ex)=>busy(d,ex).filter(b=>von<b.bis&&bis>b.von);
function gaps(d,ex){if(!d||d<today())return [];const A=hm(S.cfg.arbeitVon||'08:30'),B=hm(S.cfg.arbeitBis||'17:00');let t=A;
  if(d===today()){const n=new Date();t=Math.max(A,Math.ceil((n.getHours()*60+n.getMinutes())/15)*15)}
  const g=[];busy(d,ex).forEach(b=>{if(b.von>t)g.push([t,Math.min(b.von,B)]);t=Math.max(t,b.bis)});if(t<B)g.push([t,B]);return g.filter(([a,b])=>b-a>=15)}
function slots(d,dur,ex,max=8){const r=[];gaps(d,ex).forEach(([a,b])=>{const c=[a];for(let h=Math.ceil((a+1)/60)*60;h+dur<=b;h+=60)c.push(h);c.forEach(x=>{if(x+dur<=b&&!r.includes(x))r.push(x)})});return r.sort((a,b)=>a-b).slice(0,max)}
function frei(f){const box=f.querySelector('#fFrei');if(!box)return;delete f.dataset.ok;if(f.dataset.art==='miete'){box.innerHTML='';return}
  const d=f.elements.datum.value,von=hm(f.elements.zeit.value),bis=hm(f.elements.bis.value),dur=bis>von?bis-von:60,ex=f.elements.id.value,c=d&&bis>von?clash(d,von,bis,ex):[],sl=slots(d,dur,ex),nx=[];
  for(let i=1;i<=21&&nx.length<5;i++){const dd=addD(d&&d>today()?d:today(),i),x=slots(dd,dur,ex,1);if(x.length)nx.push([dd,x[0]])}
  box.innerHTML=`${c.length?`<p class="warn">Überschneidung mit ${c.map(x=>`${esc(x.titel)} (${hmS(x.von)}–${hmS(x.bis)})`).join(', ')}</p>`:d&&bis>von&&d>=today()?'<p class="okay">✓ Zeit ist frei</p>':''}${d>=today()?`<p class="hint" style="margin:6px 0 4px">Frei am ${WDS[s2d(d).getDay()]} ${esc(fDs(d).slice(0,6))} für ${dTxt(dur/60)}</p><div class="chips">${sl.map(x=>`<button type="button" data-act="fSlot" data-d="${d}" data-v="${x}">${hmS(x)}</button>`).join('')||'<span class="hint">Nichts mehr frei.</span>'}</div>`:''}${nx.length?`<p class="hint" style="margin:8px 0 4px">Nächste freie Termine</p><div class="chips">${nx.map(([dd,x])=>`<button type="button" data-act="fSlot" data-d="${dd}" data-v="${x}">${WDS[s2d(dd).getDay()]} ${esc(fDs(dd).slice(0,6))} ${hmS(x)}</button>`).join('')}</div>`:''}`}
function dayPlan(d){const it=[];events().filter(e=>e.datum===d).forEach(e=>it.push({t:hm(e.zeit),h:evRow(e)}));
  blocksOn(d).forEach(b=>it.push({t:hm(b.zeit),h:`<button class="ev blk" type="button" data-act="editB" data-id="${b.id}"><span class="tm cond">${esc(b.zeit)}</span><span><b>${esc(b.titel||'Blockzeit')}</b><small>bis ${esc(b.bis)}${b.wdh==='taeglich'?' · jeden Tag':b.wdh==='woechentlich'?' · jede Woche':''}</small></span><span class="ev-r"><span class="chip">blockiert</span></span></button>`}));
  gaps(d).forEach(([a,b])=>it.push({t:a,f:1,h:`<button class="free" type="button" data-act="newAt" data-d="${d}" data-v="${a}" style="min-height:${Math.round(Math.max(52,Math.min(150,(b-a)*0.5)))}px"><span class="tm cond">${hmS(a)}</span><span><b>frei bis ${hmS(b)}</b><small>${dTxt((b-a)/60)} · antippen für neue Lektion</small></span></button>`}));
  return it.sort((x,y)=>x.t-y.t||(x.f||0)-(y.f||0)).map(x=>x.h).join('')}

async function addMany(list){let n=0,dup=0;const seen=new Set(S.kunden.map(k=>fullName(k).toLowerCase())),tels=new Set(S.kunden.map(k=>telKey(k.tel)).filter(Boolean));

const dNav=(d,act)=>{const a=addD(d,-1),b=addD(d,1),k=x=>`${WDS[s2d(x).getDay()]} ${fDs(x).slice(0,6)}`;return `<div class="daynav"><button class="btn" type="button" data-act="${act}" data-d="-1" aria-label="Vortag">‹ ${k(a)}</button><b class="cond">${fD(d)}</b><button class="btn" type="button" data-act="${act}" data-d="1" aria-label="Nächster Tag">${k(b)} ›</button></div>`};
const calBar=sel=>`<div class="calbar">${calSeg()}<button class="btn ghost" type="button" data-act="calToday"${sel===today()?' disabled':''}>Heute</button></div>`;

function dayItems(d){const r=[];

  S.kurse.forEach(k=>(k.termine||[]).forEach(t=>{if(t.datum===d)r.push({von:hm(t.zeit),bis:hm(bisOf(t)),cls:'k',act:'openK',id:k.id,t:k.titel,s:tpName(k.treffpunkt),z:vonBis(t)})}));

  r.sort((a,b)=>a.von-b.von||b.bis-a.bis);
  let grp=[],end=-1;const fin=()=>{const cols=[];grp.forEach(x=>{let c=cols.findIndex(e=>e<=x.von);if(c<0){c=cols.length;cols.push(0)}cols[c]=x.bis;x.c=c});grp.forEach(x=>x.n=cols.length);grp=[]};

function dayView(){const d=S.sel||(S.sel=today()),dd=s2d(d),it=dayItems(d),A=hm(S.cfg.arbeitVon||'08:30'),B=hm(S.cfg.arbeitBis||'17:00');

V.kalender=()=>{if((S.calMode||'tag')==='tag')return dayView();const m=S.cal||(S.cal=today().slice(0,7)),sel=S.sel||(S.sel=today());const [y,mo]=m.split('-').map(Number);

async function fotoLaden(inp){const file=inp.files&&inp.files[0];if(!file)return;try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
  const M=640,sc=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
  const url=c.toDataURL('image/jpeg',0.7),f=inp.form;f.elements.foto.value=url;f.querySelector('#fmFotoV').innerHTML=`<img class="mfoto" src="${url}" alt="Foto">`;toast('Foto übernommen')}catch(e){toast('Foto konnte nicht gelesen werden')}finally{inp.value=''}}

  przT:b=>updK(b.dataset.id,c=>{const t=c.termine[+b.dataset.i];if(!t)return;t.da=t.da||[];const kid=b.dataset.k;t.da=t.da.includes(kid)?t.da.filter(x=>x!==kid):[...t.da,kid]}),
  kMsg:b=>{const k='m'+b.dataset.id;S.open[k]=S.open[k]===b.dataset.v?null:b.dataset.v;render()},

  delA:b=>ask('Ausgabe löschen?','Löschen',()=>drop('ausgaben',b.dataset.id)),
  yMove:b=>{S.year+=+b.dataset.d;render()},
  pdf:()=>{if(!window.jspdf){toast('PDF-Modul nicht geladen');return}offer(`Abrechnung_${fnSafe(S.cfg.firma)}_${S.year}.pdf`,pdfAbr(S.year))},
  csvE:()=>offer(`Einnahmen_${S.year}.csv`,csv([['Zahlungsdatum','Kunde','Leistung','Zahlungsart','Betrag CHF'],...einnahmen(S.year).map(r=>[fDs(r.datum),r.kunde,r.leistung,r.zahlart,r.betrag.toFixed(2)])])),
  csvA:()=>offer(`Ausgaben_${S.year}.csv`,csv([['Datum','Kategorie','Beschreibung','Betrag CHF'],...ausgabenY(S.year).map(a=>[fDs(a.datum),a.kategorie,a.text,(+a.betrag||0).toFixed(2)])])),
  csvF:()=>{const {fa,wk}=fahrten(S.year),a=(+S.cfg.kmAnsatz||0).toFixed(2);offer(`Fahrten_${S.year}.csv`,csv([['Datum','Treffpunkt','km einfach','km hin und zurück','Ansatz CHF/km','Fahrt CHF','Parkiert von','Parkiert bis','Parkgebühr CHF','Bemerkung'],...[...fa.map(x=>({d:x.datum,r:[fDs(x.datum),x.ort,num1(x.km),num1(x.kmHR),a,x.betrag.toFixed(2),x.pflicht?hmS(x.pVon):'',x.pflicht?hmS(x.pBis):'',x.park.toFixed(2),x.wk?'Wochenkarte':'']})),...wk.map(w=>({d:w.von,r:[fDs(w.von),'Wochenkarte Parkieren','','','','0.00','','',w.betrag.toFixed(2),`gültig ${fDs(w.von)} bis ${fDs(w.bis)}`]}))].sort((p,q)=>p.d.localeCompare(q.d)).map(x=>x.r)]))},
  seed:async()=>{if(ENV!=='test')return;closeSheet();toast('Testdaten werden neu geladen …');for(const c of COLS)for(const x of [...S[c]])await drop(c,x.id);await seedTest();toast('Testdaten geladen')},
  wipe:()=>{if(ENV!=='test')return;ask('Alle Testdaten löschen?','Alles löschen',async()=>{for(const c of COLS)for(const x of [...S[c]])await drop(c,x.id);toast('Testdaten gelöscht')})},
  backup:()=>offer(`Langlaufspass_Sicherung_${today()}.json`,JSON.stringify({exportiert:new Date().toISOString(),config:S.cfg,kunden:S.kunden,lektionen:S.lektionen,kurse:S.kurse,ausgaben:S.ausgaben,blocker:S.blocker,material:S.material,service:S.service},null,1))
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,h=F[f.dataset.form];if(h)h(f)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='kq'){S.q=t.value;$('#klist').innerHTML=kList()}else if(t.id==='fBetrag'&&t.form)t.form.dataset.manual='1';else if(t.id==='fZeit'&&t.form&&t.value){const f=t.form;f.elements.bis.value=hmS(hm(t.value)+Math.round((+f.dataset.dur||1)*60));recalc(f);frei(f)}else if(t.id==='fBis'&&t.form){recalc(t.form);frei(t.form)}else if(t.id==='fRueck'&&t.form){recalc(t.form);mAssign(t.form)}else if(t.id==='fDatum'&&t.form){frei(t.form);mAssign(t.form);const w=t.form.querySelector('#fNeuWrap');if(w){const n=dayCount(t.value,t.form.elements.id.value);w.hidden=!n;if(!n)w.querySelector('input').checked=false}}else if(t.id==='fNkTel'||t.id==='fcTel')telHit(t);else if(t.dataset?.m&&t.closest('.mrow')&&(t.dataset.m==='cm'||t.dataset.m==='schuh'||t.dataset.m==='kg'))mAssign(t.form)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='fmFotoIn'){fotoLaden(t);return}if(t.dataset?.a&&t.closest('.mrow')){t.closest('.mrow').dataset[t.dataset.a]=t.value;mAssign(t.form);return}if(t.id==='fKunde'){const n=t.form.querySelector('.newk');n.hidden=t.value!=='__neu';const i=t.form.querySelector('#kInfo');if(i)i.innerHTML=kInfo(t.value);if(!n.hidden)t.form.elements.nkVorname.focus()}else if(t.id==='vcf'){importVcf(t.files[0]).catch(()=>toast('Datei konnte nicht gelesen werden')).finally(()=>t.value='')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
const MIME={pdf:'application/pdf',csv:'text/csv;charset=utf-8',json:'application/json'};
dl={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:MIME[filename.split('.').pop()]||'application/octet-stream'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return {status:'saved'}}};
function miniUpd(){const m=$('#mini'),b=document.querySelector('.band');if(!m)return;const on=!!(b&&S.user&&scrollY>b.offsetHeight-56);if(on){const t=b.querySelector('h1')?.textContent||'',u=b.querySelector('.sub')?.textContent||'',h=`<img src="icon-192.png" alt=""><span><b>${esc(t)}</b>${u?`<small>${esc(u)}</small>`:''}</span><button class="gear" type="button" data-act="settings" aria-label="Einstellungen">${GEAR}</button>`;if(m.dataset.h!==h){m.innerHTML=h;m.dataset.h=h}}m.classList.toggle('on',on)}
addEventListener('scroll',miniUpd,{passive:true});
addEventListener('hashchange',route);
route();
function boot(){const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/HIER/.test(cfg.apiKey)){S.mode='setup';S.user=null;render();return}
  try{FB=window.LLFB.start(cfg)}catch(e){S.mode='setup';S.user=null;render();return}
  FB.onWriteError(e=>toast(e?.code==='permission-denied'?'Keine Berechtigung zum Speichern':'Speichern fehlgeschlagen ('+(e?.code||'Fehler')+')'));
  FB.onUser(u=>{S.user=u||null;if(u&&!db){db=FB.db;S.mode='laden';subscribe()}else if(!u&&db){unsubscribe();db=null}render()})}
window.LLFB?boot():addEventListener('llfb',boot,{once:true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
